app = 'open-ship-tracker'
primary_region = 'fra'

[build]

[env]
  DATA_DIR = '/data'
  SYNC_TOKEN = 'ost_sync_99e8a71b26f50c3d'

[http_service]
  internal_port = 8050
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[mounts]
  source = 'open_ship_tracker_data'
  destination = '/data'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
